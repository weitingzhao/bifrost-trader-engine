site_name: Bifrost Trader Engine
site_description: Gamma scalping trading daemon documentation
site_url: https://github.com/weitingzhao/bifrost-trader-engine

theme:
  name: material

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/diagram-zoom.js

plugins:
  - search
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - FSM:
    - Linkage (sequence): fsm/linkage.md
    - Linkage (detailed): fsm/FSM_LINKAGE.md
    - Hedge FSM: fsm/hedge.md
    - Trading FSM: fsm/trading.md
    - Daemon FSM: fsm/daemon.md
  - Research:
    - State Space: research/STATE_SPACE_MAPPING.md
    - Config Safety: research/CONFIG_SAFETY_TAXONOMY.md
    - Guard Tuning: research/GUARD_TUNING_AND_IMPACT.md
    - Massive API coverage: plans/massive-api-coverage.md
    - Option data feed:
      - Overview: plans/option-data-feed/README.md
      - Architecture & Research: plans/option-data-feed/ARCHITECTURE_AND_RESEARCH.md
      - Database plan: plans/option-data-feed/DATABASE_PLAN.md
      - WebSocket plan: plans/option-data-feed/WEBSOCKET_PLAN.md
      - Worker plan: plans/option-data-feed/WORKER_PLAN.md
      - FastAPI plan: plans/option-data-feed/FASTAPI_PLAN.md
      - UI Checklist & Backfill: plans/option-data-feed/UI_CHECKLIST_AND_BACKFILL.md
      - Max Pain report: plans/option-data-feed/MAX_PAIN_REPORT.md

# Reverse proxy: public HTTP (80) -> bifrost-server (uvicorn on 127.0.0.1:8765).
# Install on the server (Debian/Ubuntu style):
#   sudo cp deploy/nginx/bifrost-status.conf /etc/nginx/sites-available/bifrost-status
#   sudo ln -sf /etc/nginx/sites-available/bifrost-status /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Edit the first server_name to this host's LAN IP or DNS. 127.0.0.1/localhost help
# curl tests from the server itself. Keep bifrost-server on 8765.
#
# If you still get nginx's 404 HTML (not JSON from the app), another vhost is winning
# port 80 — disable Ubuntu's default: sudo rm /etc/nginx/sites-enabled/default

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.10.70 127.0.0.1 localhost;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/quotes stream, etc.)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

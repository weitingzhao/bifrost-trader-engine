# Reverse proxy for Bifrost APIs. Ports are filled from merged YAML (do not edit by hand); regenerate with:
#   python scripts/systemd/render_nginx_status_conf.py
# Uses merged YAML (config.yaml + config.prod.yaml when BIFROST_CONFIG points at prod), same as uvicorn.
#
# Path → backend (single origin :80; matches FastAPI route prefixes in backend/*/routers):
#   /research/massive → Massive | /research/docs, /bifrost-api-docs/ → Docs | /ops → Ops
#   /strategies/ → Strategy | /portfolio/, /position-categories → Portfolio
#   /trading/, /executions, /performance, /transactions → Trading
#   /bars, /watchlist, /quotes, /market/, /indices/ → Market
#   /research/ (rest) → Research API (option discovery, max pain) — longer /research/massive|docs win first
#   /mkdocs/ → static MkDocs (site/ from mkdocs build; publish: ./scripts/bifrost_ssh.sh --deploy-mkdocs)
#   / → Monitor (SPA, /status, /health, …). GET /health is only the Monitor process on this host.
#
# Install (Debian/Ubuntu) — HTTP only; nginx -t passes without TLS files:
#   python scripts/systemd/render_nginx_status_conf.py
#   sudo cp deploy/nginx/bifrost-status.conf /etc/nginx/sites-available/bifrost-status
#   sudo ln -sf /etc/nginx/sites-available/bifrost-status /etc/nginx/sites-enabled/bifrost-status
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (optional): render ssl template then copy (see bifrost-status-ssl.conf.template).
#
# Hostname: add your DNS (e.g. ai.trader) to server_name; if https://... 404s, check nginx -T | grep server_name
#
# Uvicorn backends speak HTTP only. Do NOT use https://host:<port> in proxy_pass — terminate TLS in nginx.

# --- HTTP only (no ssl_certificate — nginx -t works on fresh hosts) ---
server {
    listen 80;
    listen [::]:80;
    server_name ai.trader 192.168.10.70 127.0.0.1 localhost;

    # Optional: redirect all HTTP to HTTPS (uncomment after :443 works)
    # return 301 https://$host$request_uri;

    # Massive API. Prefix without trailing slash so /research/massive matches.
    location ^~ /research/massive {
        proxy_pass http://127.0.0.1:8741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Docs API. Same proxy pattern as Massive — full path forwarded.
    location ^~ /research/docs {
        proxy_pass http://127.0.0.1:8719;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /bifrost-api-docs/ {
        proxy_pass http://127.0.0.1:8719/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ops API — control plane. LAN-only access.
    location ^~ /ops {
        # Restrict to LAN subnets (uncomment and adjust for production)
        # allow 192.168.10.0/24;
        # deny all;

        proxy_pass http://127.0.0.1:8713;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Strategy API (routers use prefix /strategies)
    location ^~ /strategies/ {
        proxy_pass http://127.0.0.1:8735;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Portfolio API
    location ^~ /portfolio/ {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /position-categories {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Trading API (docs/openapi under /trading/*; REST at /executions, /performance, /transactions)
    location ^~ /trading/ {
        proxy_pass http://127.0.0.1:8721;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /executions {
        proxy_pass http://127.0.0.1:8721;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /performance {
        proxy_pass http://127.0.0.1:8721;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /transactions {
        proxy_pass http://127.0.0.1:8721;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Market API
    location ^~ /bars {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /watchlist {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /quotes {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /market/ {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /indices/ {
        proxy_pass http://127.0.0.1:8733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Research API (option discovery, max pain, …) — must follow /research/massive and /research/docs above
    location ^~ /research/ {
        proxy_pass http://127.0.0.1:8731;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # MkDocs static site (build: mkdocs build -f mkdocs.prod.yml; output site/). Path must match mkdocs.prod.yml site_url.
    # If DEPLOY_PATH on the server is not /home/vision/bifrost-trader-engine, adjust alias to …/site/ and reload nginx.
    # Without trailing slash, prefix location /mkdocs/ does not match — redirect to /mkdocs/ so requests do not fall through to Monitor (JSON 404).
    location = /mkdocs {
        return 301 /mkdocs/;
    }
    location ^~ /mkdocs/ {
        alias /home/vision/bifrost-trader-engine/site/;
        index index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8711;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

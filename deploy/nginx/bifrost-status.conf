# Reverse proxy: bifrost-server (8765), Massive API (8766), Docs API (8767).
#
# Docs / Massive paths:
# - This file routes /research/docs → 8767 and /research/massive → 8766 on port 80/443 only.
# - If you curl :80 and get empty/refused, nginx is not installed, not listening on :80, or this
#   site is not enabled — fix nginx, not the Python apps.
# - bifrost-server (8765) also proxies /research/docs and /research/massive to localhost when
#   the repo includes servers/routers/research_sidecars.py — deploy latest code and restart
#   bifrost-server so curl http://127.0.0.1:8765/research/docs/health works without nginx.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx/bifrost-status.conf /etc/nginx/sites-available/bifrost-status
#   sudo ln -sf /etc/nginx/sites-available/bifrost-status /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Hostname: add your public DNS (e.g. ai.trader) to server_name on BOTH :80 and :443 blocks.
# If https://yourname/... hits the wrong vhost or 404, another site is winning — check
#   nginx -T | grep server_name
#
# HTTPS:
# - Uvicorn on 8765/8766/8767 speaks HTTP only. Do NOT use https://host:8766 — it will fail.
# - Use https://host/research/massive/redoc or https://host/research/docs/redoc (port 443) after SSL.
#
# Certificates: replace paths with your real files (e.g. certbot: /etc/letsencrypt/live/ai.trader/...).
# If you do not have TLS yet, keep only the :80 server block or comment out the :443 block.

# --- HTTP ---
server {
    listen 80;
    listen [::]:80;
    server_name ai.trader 192.168.10.70 127.0.0.1 localhost;

    # Optional: redirect all HTTP to HTTPS (uncomment after :443 works)
    # return 301 https://$host$request_uri;

    # Massive API (127.0.0.1:8766). Prefix without trailing slash so /research/massive matches.
    location ^~ /research/massive {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Docs API (127.0.0.1:8767). Same proxy pattern as Massive — full path forwarded.
    location ^~ /research/docs {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /bifrost-api-docs/ {
        proxy_pass http://127.0.0.1:8767/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ops API (127.0.0.1:8768) — control plane. LAN-only access.
    location ^~ /ops {
        # Restrict to LAN subnets (uncomment and adjust for production)
        # allow 192.168.10.0/24;
        # deny all;

        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

# --- HTTPS (same routes as HTTP; enable after certs exist) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.trader 192.168.10.70 127.0.0.1 localhost;

    # EDIT: point to your PEMs (example: Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/ai.trader/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.trader/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /research/massive {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /research/docs {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ^~ /bifrost-api-docs/ {
        proxy_pass http://127.0.0.1:8767/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ops API (127.0.0.1:8768) — control plane. LAN-only access.
    location ^~ /ops {
        # allow 192.168.10.0/24;
        # deny all;

        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

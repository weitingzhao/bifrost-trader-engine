# Optional Playwright visual baselines for legacy CSS retirement (Phase 7 Wave 10).
# Does not block merges by default — inspect artifacts on failure.
name: Frontend visual baselines

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-visual.yml'
  workflow_dispatch:

concurrency:
  group: frontend-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        run: npm run build

      - name: Run visual regression tests
        run: npm run test:visual
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
